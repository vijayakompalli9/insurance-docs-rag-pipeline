[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-docs-rag-pipeline"
version = "0.1.0"
description = "Offline-first RAG pipeline over synthetic insurance documents with PII redaction, incremental indexing and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vijaya Lakshmi Kompalli" }]

[project.optional-dependencies]
aws = ["boto3"]
azure = ["openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_pipeline = ["prompts/*.md"]

[tool.ruff]
line-length = 105
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
